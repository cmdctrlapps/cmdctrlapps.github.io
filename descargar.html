    <script>
        (function () {
            var IOS_URL = "https://apps.apple.com/cr/app/spent-controla-tus-gastos/id6449729260";
            var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.cmdctrl.SpentApp";
            var FALLBACK_URL = "/#descargar";
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            // iPadOS 13+ se reporta como Mac: lo detectamos por la pantalla táctil.
            var isIPad = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;

            if ((/iPad|iPhone|iPod/.test(ua) || isIPad) && !window.MSStream) {
                window.location.replace(IOS_URL);
            } else if (/android/i.test(ua)) {
                window.location.replace(ANDROID_URL);
            } else {
                window.location.replace(FALLBACK_URL);
            }
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=/#descargar"></noscript>
